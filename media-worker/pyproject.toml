[project]
name = "media-worker"
version = "0.1.0"
description = "Local media and AI worker for the AI YouTube Employee (see ARCHITECTURE.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2",
    "httpx>=0.28",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S607"]  # we run ffmpeg/ffprobe with argument lists on purpose (no shell)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
